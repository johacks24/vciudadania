name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar paquete
        run: pip install -e "congreso[dev]"
      - name: Tests (sin red, con fixture real)
        run: pytest congreso -q
