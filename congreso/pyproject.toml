[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "congreso"
version = "0.1.0"
description = "Ingesta y validación de votaciones del Congreso de los Diputados (datos abiertos)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
congreso = "congreso.cli:main"

[tool.setuptools.packages.find]
include = ["congreso*"]
